<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="CropGuard AI - Smart Plantation Monitoring">
  <title>CropGuard AI — Farmer Dashboard</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
  <link rel="shortcut icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./styles.css">
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script>
    (function () {
      fetch("./app.js")
        .then(function (response) {
          if (!response.ok) {
            throw new Error("Failed to fetch app.js: " + response.status);
          }
          return response.text();
        })
        .then(function (code) {
          var compiled = Babel.transform(code, {
            presets: [["react", { runtime: "classic" }]],
            filename: "app.js",
          }).code;
          var script = document.createElement("script");
          script.text = compiled;
          document.body.appendChild(script);
        })
        .catch(function (err) {
          console.error("[CropGuard] Failed to boot app.js:", err);
        });
    })();
  </script>
</body>
</html>
