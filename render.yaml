services:

  - type: web

    name: cropguard-ai-backend

    env: python

    rootDir: backend

    buildCommand: chmod +x build.sh && ./build.sh

    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT

    envVars:

      - key: CROPGUARD_MODEL_URL

        value: https://raw.githubusercontent.com/Chandangowdakt/CropGuard-AI/main/backend/chrysanthemum_model.pth

